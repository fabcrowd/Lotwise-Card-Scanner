<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Card Lot - Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
    h1 { color: #333; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .card-item { border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #fafafa; }
    .card-item img { width: 100%; height: auto; display: block; border-radius: 4px; }
    .card-name { font-weight: bold; margin-top: 8px; text-align: center; }
    .card-set { color: #666; font-size: 0.9em; text-align: center; }
  </style>
</head>
<body>
  <h1>Pokemon Card Lot - 5 Cards</h1>
  <p>This is a test listing with multiple Pokemon cards for sale.</p>

  <div class="card-grid">
    <div class="card-item">
      <img src="https://assets.tcgdex.net/en/base/base1/4/high.webp" alt="Charizard Base Set" />
      <div class="card-name">Charizard</div>
      <div class="card-set">Base Set - 4/102</div>
    </div>
    <div class="card-item">
      <img src="https://assets.tcgdex.net/en/base/base1/2/high.webp" alt="Blastoise Base Set" />
      <div class="card-name">Blastoise</div>
      <div class="card-set">Base Set - 2/102</div>
    </div>
    <div class="card-item">
      <img src="https://assets.tcgdex.net/en/base/base1/15/high.webp" alt="Venusaur Base Set" />
      <div class="card-name">Venusaur</div>
      <div class="card-set">Base Set - 15/102</div>
    </div>
    <div class="card-item">
      <img src="https://assets.tcgdex.net/en/base/base1/58/high.webp" alt="Pikachu Base Set" />
      <div class="card-name">Pikachu</div>
      <div class="card-set">Base Set - 58/102</div>
    </div>
    <div class="card-item">
      <img src="https://assets.tcgdex.net/en/base/base1/1/high.webp" alt="Alakazam Base Set" />
      <div class="card-name">Alakazam</div>
      <div class="card-set">Base Set - 1/102</div>
    </div>
  </div>
</body>
</html>
